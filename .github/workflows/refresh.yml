name: Refresh Classroom Data

on:
  schedule:
    # Beijing time:
    #   Overnight burst: 00:00 / 02:00 / 04:00 / 06:00 / 07:00
    #   Daytime polling: once an hour from 08:00 to 21:00
    # Each run retries up to 30 times (random 0-30s backoff). Once today's data
    # is captured, every later cron run on the same day skips the work.
    - cron: '0 0-13,16,18,20,22,23 * * *'
  workflow_dispatch:

# Only one refresh may run at a time. If the 02:00 cron fires while the 00:00
# run is still retrying, the older run is killed and the newer one takes over.
concurrency:
  group: classroom-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ============================================================
      # 0. Compute the Beijing date
      # ============================================================
      - name: Get Beijing date
        id: date
        run: echo "beijing_date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 1. Check whether fresh data has already been captured today.
      #    If so, skip every remaining step.
      # ============================================================
      - name: Check if fresh data already exists for today
        id: fresh
        uses: actions/cache/restore@v4
        with:
          path: .fresh-today
          key: classroom-fresh-${{ steps.date.outputs.beijing_date }}

      - name: Skip (already fresh today)
        if: steps.fresh.outputs.cache-hit == 'true'
        run: |
          echo "=== $(TZ='Asia/Shanghai' date): fresh data already captured, skipping refresh ==="

      # ============================================================
      # 2. Fetch data (only when today's fresh data is still missing)
      # ============================================================
      - name: Checkout
        if: steps.fresh.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      # Restore the last successfully fetched data, used as a fallback when the
      # API is down. Prefer today's key, otherwise fall back to the newest one.
      - name: Restore last known data
        if: steps.fresh.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: frontend/public/data.json
          key: classroom-data-${{ steps.date.outputs.beijing_date }}
          restore-keys: |
            classroom-data-

      - name: Setup pnpm
        if: steps.fresh.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        if: steps.fresh.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # RELAY_URL and RELAY_SECRET point at the campus-hosted relay that sits
      # between this runner and the teaching-affairs API. They are repository
      # secrets so the tunnel address and shared secret never land in the repo.
      - name: Fetch classroom data
        id: fetch
        if: steps.fresh.outputs.cache-hit != 'true'
        env:
          JW_USERNAME: ${{ secrets.JW_USERNAME }}
          JW_PASSWORD: ${{ secrets.JW_PASSWORD }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: node script/fetch.mjs

      - name: Install frontend dependencies
        if: steps.fresh.outputs.cache-hit != 'true'
        run: |
          cd frontend
          pnpm install

      - name: Build frontend
        if: steps.fresh.outputs.cache-hit != 'true'
        run: |
          cd frontend
          pnpm build

      - name: Deploy to Cloudflare Pages
        if: steps.fresh.outputs.cache-hit != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=emptyclassroom

      # ============================================================
      # 3. Mark "today's fresh data captured".
      #    Writes a marker file and caches it so later cron runs today stop.
      # ============================================================
      - name: Write fresh-today marker
        if: steps.fresh.outputs.cache-hit != 'true' && steps.fetch.outputs.data_fresh == 'true'
        run: |
          echo "${{ steps.date.outputs.beijing_date }} fresh" > .fresh-today
          echo "=== Marked today's data as updated; later cron runs will skip ==="

      - name: Save freshness cache
        if: steps.fresh.outputs.cache-hit != 'true' && steps.fetch.outputs.data_fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .fresh-today
          key: classroom-fresh-${{ steps.date.outputs.beijing_date }}

      # Persist the data.json fetched by this run. Even stale data beats an
      # empty shell, and a later checkout with no data.json restores it here.
      - name: Save data cache
        if: steps.fresh.outputs.cache-hit != 'true' && steps.fetch.outputs.data_fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: frontend/public/data.json
          key: classroom-data-${{ steps.date.outputs.beijing_date }}

      # ============================================================
      # 4. Summary
      # ============================================================
      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "  Beijing Date : ${{ steps.date.outputs.beijing_date }}"
          echo "  Cache Hit    : ${{ steps.fresh.outputs.cache-hit || 'false' }}"
          echo "  Data Fresh   : ${{ steps.fetch.outputs.data_fresh || 'N/A' }}"
          echo "  Data Date    : ${{ steps.fetch.outputs.data_date || 'N/A' }}"
          echo "=============================="
